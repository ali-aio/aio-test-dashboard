<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console — Test Dashboard</title>
<link rel="stylesheet" href="style.css">
<style>
  body { max-width: none; padding: 0; height: 100vh; overflow: hidden; background: #0d0d12; color: #f4f4f6; }
  .topbar { padding: 14px 20px; border-bottom: 1px solid #2a2a35; margin: 0; }
  .topbar a, .topbar button { }
  .nav-tabs { display: flex; gap: 4px; padding: 0 20px; }
  .nav-tabs a { padding: 10px 14px; font-size: 0.8rem; font-weight: 600; color: #8a8b95; text-decoration: none; border-bottom: 2px solid transparent; }
  .nav-tabs a.active { color: #f9805f; border-color: #f9805f; }
  .shell { display: grid; grid-template-columns: 1fr 340px; gap: 1px; background: #2a2a35; height: calc(100vh - 100px); }
  .main { background: #16161d; padding: 18px 20px; overflow-y: auto; }
  .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 16px; }
  .stat-tile { background: #1e1e27; border: none; border-radius: 10px; padding: 12px 14px; }
  .console-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  .console-table th { text-align: left; padding: 8px 10px; color: #8a8b95; font-size: 0.65rem; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid #2a2a35; position: sticky; top: 0; background: #16161d; }
  .console-table td { padding: 8px 10px; border-bottom: 1px solid #202029; }
  .console-table tr.device-row { cursor: pointer; transition: background .12s; animation: slidein .3s var(--ease) both; }
  .console-table tr.device-row:hover { background: #1a1a22; }
  .console-table tr.device-row.sel { background: #1e1e27; }
  .badge { font-size: 0.62rem; padding: 2px 8px; border-radius: 999px; background: #262633; color: #99a1f2; font-weight: 700; text-transform: uppercase; }
  .detail { background: #121218; padding: 20px; overflow-y: auto; }
  .detail h3 { font-size: 0.95rem; margin: 0 0 4px; }
  .detail .sub { font-size: 0.72rem; color: #8a8b95; margin-bottom: 16px; font-family: var(--mono); }
  .detail .chart-label { font-size: 0.68rem; color: #8a8b95; text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 6px; }
  .legend { color: #8a8b95; }
  .banner { margin: 16px 20px 0; }
  .empty-detail { color: #5f5f66; font-size: 0.85rem; text-align: center; padding: 60px 20px; }
  .range-btns button { background: #1e1e27; border-color: #2a2a35; color: #8a8b95; }
  .range-btns button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <h1>Test Dashboard</h1>
  </div>
  <div class="topbar-actions">
    <span id="scope-badge"></span>
    <span id="last-sync" class="muted" style="color:#8a8b95"><span class="live-dot"></span></span>
    <button id="refresh" type="button" class="btn-primary">Refresh</button>
    <a href="settings.html" class="btn-ghost" style="text-decoration:none;background:#1e1e27;border-color:#2a2a35;color:#b3b4bd">Settings</a>
  </div>
</header>
<nav class="nav-tabs">
  <a href="console.html" class="active">Console</a>
  <a href="cycles.html">Cycles</a>
  <a href="index.html">Spreadsheet</a>
</nav>
<div id="banner" class="banner" hidden></div>

<div class="shell">
  <div class="main">
    <div class="stats" id="stats"></div>
    <table class="console-table">
      <thead><tr><th>serial</th><th>class</th><th>battery</th><th>trend</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="detail" id="detail">
    <div class="empty-detail">Click a device to see its history.</div>
  </div>
</div>

<script type="module">
import { fetchDevices, fetchHistory, requireConfig, showBanner, mapLimit, initScopeBadge } from './shared/data.js';
import { renderHistoryChart, sparkline } from './shared/chart.js';

const banner = document.getElementById('banner');
const statsEl = document.getElementById('stats');
const rowsEl = document.getElementById('rows');
const detailEl = document.getElementById('detail');
const lastSync = document.getElementById('last-sync');
const refreshBtn = document.getElementById('refresh');

let devices = [];
let selected = null;
const sparkCache = {};

async function load(fresh = false) {
  refreshBtn.classList.add('loading');
  refreshBtn.innerHTML = '<span class="spinner"></span> Refreshing';
  try {
    devices = await fetchDevices({ fresh });
    showBanner(banner, null);
    lastSync.innerHTML = `<span class="live-dot"></span>synced ${new Date().toLocaleTimeString()}`;
    renderStats();
    renderRows();
  } catch (err) {
    showBanner(banner, `Error: ${err.message}`);
  } finally {
    refreshBtn.classList.remove('loading');
    refreshBtn.textContent = 'Refresh';
  }
}

function renderStats() {
  const online = devices.filter(d => d.last_seen_at && (Date.now() - new Date(d.last_seen_at)) < 15 * 60 * 1000).length;
  const classes = new Set(devices.map(d => d.device_class)).size;
  const cycles = (devices.reduce((s, d) => s + (d.discharge_total_pct || 0), 0) / 100).toFixed(0);
  statsEl.innerHTML = [
    [devices.length, 'devices'], [online, 'seen <15m'], [classes, 'classes'], [cycles, 'total cycles'],
  ].map(([n, l]) => `<div class="stat-tile"><div class="n" style="font-family:var(--mono);font-size:1.4rem;font-weight:700">${n}</div><div class="l" style="font-size:0.68rem;color:#8a8b95;text-transform:uppercase">${l}</div></div>`).join('');
}

async function renderRows() {
  rowsEl.innerHTML = devices.map((d, i) => `
    <tr class="device-row ${selected === d.serial_number ? 'sel' : ''}" data-serial="${d.serial_number}" style="animation-delay:${Math.min(i,15)*20}ms">
      <td style="font-family:var(--mono)">${d.serial_number}</td>
      <td><span class="badge">${d.device_class || '—'}</span></td>
      <td style="font-family:var(--mono)">${d.battery_pct ?? '—'}</td>
      <td><span class="spark-host" data-serial="${d.serial_number}">…</span></td>
    </tr>`).join('');
  rowsEl.querySelectorAll('tr').forEach(tr => tr.addEventListener('click', () => selectDevice(tr.dataset.serial)));
  // Sparklines fetch with up to 6 in flight at once (not one-at-a-time) and are cached
  // across page navigations by shared/data.js, so a repeat visit paints instantly.
  await mapLimit(devices, 6, async d => {
    try {
      const hist = sparkCache[d.serial_number] || (sparkCache[d.serial_number] = await fetchHistory(d.serial_number, 24));
      const host = rowsEl.querySelector(`.spark-host[data-serial="${CSS.escape(d.serial_number)}"]`);
      if (host) host.innerHTML = sparkline(hist, 'battery_pct', '#99a1f2', 70, 20);
    } catch (e) { /* leave placeholder */ }
  });
}

async function selectDevice(serial) {
  selected = serial;
  renderRows();
  const d = devices.find(x => x.serial_number === serial);
  detailEl.innerHTML = `
    <h3>${serial}</h3>
    <div class="sub">${d.device_class} · ${d.restaurant_name || 'unassigned'} · last seen ${d.last_seen_at ? new Date(d.last_seen_at).toLocaleString() : '—'}</div>
    <div class="chart-label">Battery % history</div>
    <div class="range-btns" style="margin-bottom:8px"><button data-h="24" class="active">24h</button><button data-h="168">7d</button><button data-h="720">30d</button></div>
    <div class="chart-host"></div>
    <div class="legend" style="display:flex;gap:14px;font-size:0.72rem;margin-top:8px">
      <span><span class="sw" style="background:var(--chart-battery);width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:5px"></span>battery_pct</span>
      <span><span class="sw" style="background:var(--accent-soft);border:1px solid var(--accent-edge);width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:5px"></span>charging</span>
    </div>`;
  detailEl.querySelectorAll('.range-btns button').forEach(b => b.addEventListener('click', () => loadDetailRange(serial, +b.dataset.h)));
  loadDetailRange(serial, 24);
}

async function loadDetailRange(serial, hours) {
  const host = detailEl.querySelector('.chart-host');
  detailEl.querySelectorAll('.range-btns button').forEach(b => b.classList.toggle('active', +b.dataset.h === hours));
  host.innerHTML = '<div class="drawer-loading"><span class="spinner" style="border-color:#2a2a35;border-top-color:var(--accent)"></span>Loading…</div>';
  try {
    const rows = await fetchHistory(serial, hours);
    renderHistoryChart(host, rows, { key: 'battery_pct', color: '#6ba3f0', label: 'battery', unit: '%' });
  } catch (err) {
    host.innerHTML = `<div class="drawer-loading">Error: ${err.message}</div>`;
  }
}

refreshBtn.addEventListener('click', () => load(true));
initScopeBadge(document.getElementById("scope-badge"));
requireConfig(banner, load);
</script>
</body>
</html>
