    <link rel="stylesheet" crossorigin href="/assets/index-BTN_AD-A.css">

  <body>
    <script>
      /* Stamp the theme before first paint. Without this the page flashes
         light while the bundle loads, which is worse in a dim room than the
         light theme would have been. */
      try {
        /* Anything other than an explicit "light" — including the "system"
           value older versions stored — resolves to dark. */
        var t = localStorage.getItem('t7-theme') === 'light' ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
    <div id="root"></div>
  </body>
</html>
